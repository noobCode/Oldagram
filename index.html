<html>
    <head>
        <link rel="stylesheet" href="index.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">

    </head>
    <body>
        <div class="content-container">
            <header>
                <div class="header-container">
                    <img class="logo-img" src="images/logo.png">
                    <div class="pfp-container">
                        <div class="pfp"></div>
                    </div>    
                </div>  
            </header>
            
            <main>
                <subheader>
                    <div class="subheader-container">
                        <div class="artist-pfp-container">
                            <div class="artist-pfp" id="artist-pfp"></div>
                        </div>
                        <div>
                            <h1 class="artist-name" id="artist-name">Vincent Van Gogh</h1>
                            <h1 class="post-location">Zudert, Netherlands</h1>
                        </div>
                    </div>
                </subheader>
                
                <image>
                    <div class="post" id="post">
                        
                    </div>
                </image>
                
                <interactivity>
                    <div class="icons-container">
                        <div class="icons" id="likes"><img class="icon-img" src="images/icon-heart.png" alt=""></div>
                        <div class="icons"><img class="icon-img" src="images/icon-comment.png" alt=""></div>
                        <div class="icons"><img class="icon-img" src="images/icon-dm.png" alt=""></div>
                    </div>

                    <div class="text-container">
                        <div class="likes">
                            <p>21,492 likes</p>
                        </div>

                        <div class="caption">
                            <a href="" class="link-to-profile" id="username">vincey1853</a><p class="caption" id="caption"> just took a few mushrooms lol</p>
                        </div>
                    </div>
                </interactivity>  
            </main>
        </div>
        
        <script src="index.js"></script>
    </body>
</html>
