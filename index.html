<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="index.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">

    </head>
    <body>
        <div class="content-container">
            <header class="padding">
                <div class="header-container">
                    <img class="logo-img left-padding standard-margin" src="images/logo.png">
                    <div class="pfp-container right standard-height standard-width">
                        <div class="my-pfp pfp"></div>
                    </div>    
                </div>  
            </header>
            
            <main>
                <subheader>
                    <div class="subheader-container standard-margin">
                        <div class="pfp-container standard-height standard-width">
                            <div class="artist-pfp pfp" id="artist-pfp"></div>
                        </div>
                        <div class="standard-padding">
                            <h1 class="bold artist-info" id="artist-name">Vincent van Gogh</h1>
                            <h1 class="medium artist-info" id="post-location">Zundert, Netherlands</h1>
                        </div>
                    </div>
                </subheader>
                
                <div class="post-container">
                    <div class="post vangogh ducreux courbet" id="post"></div>
                </div>

                <interactivity class="padding">
                    <div class="icons-container standard-margin">
                        <div class="icons"><img class="standard-height standard-width" src="images/icon-heart.png" alt=""></div>
                        <div class="icons"><img class="standard-height standard-width" src="images/icon-comment.png" alt=""></div>
                        <div class="icons"><img class="standard-height standard-width" src="images/icon-dm.png" alt=""></div>
                    </div>

                    <div class="text-container padding standard-padding standard-margin">
                        <div class="likes bold">
                            <p id="likes">21,492 likes</p>
                        </div>

                        <div class="caption">
                            <a href="" class="link-to-profile bold" id="username">vincey1853</a><p class="caption medium" id="caption"> just took a few mushrooms lol</p>
                        </div>
                    </div>
                </interactivity>  

                <div class="lower-border standard-height"></div>
            </main>
        </div>
        
        <script src="index.js"></script>
    </body>
</html>
